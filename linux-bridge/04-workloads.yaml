---
apiVersion: v1
kind: Secret
metadata:
  name: vm-ssh-key
type: Opaque
data:
  key: "c3NoLWVkMjU1MTkgQUFBQUMzTnphQzFsWkRJMU5URTVBQUFBSUJxdVpjdkUzWDk1V3JFUWhxVkhEUE5DUGhWZDVvaVllR3F5WHNFNEM2UU8gcm9vdEBoYWRlczAzLmxhYi5lbmcudGx2Mi5yZWRoYXQuY29tCg=="
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: vm1
spec:
  runStrategy: Always
  template:
    spec:
      accessCredentials:
      - sshPublicKey:
          propagationMethod:
            noCloud: {}
          source:
            secret:
              secretName: vm-ssh-key
      nodeSelector:
        node-role.kubernetes.io/worker: ''
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                  - evpn-workload
            topologyKey: kubernetes.io/hostname
      architecture: amd64
      domain:
        cpu:
          cores: 4
          sockets: 1
          threads: 1
        memory:
          guest: 4Gi
        devices:
          disks:
          - disk:
              bus: virtio
            name: os
          - disk:
              bus: virtio
            name: cloudinitdisk
          interfaces:
          - masquerade: {}
            name: default
          - bridge: {}
            macAddress: 02:79:38:33:33:33
            model: virtio
            name: evpn
            state: up
      networks:
      - pod: {}
        name: default
      - multus:
          networkName: evpn-l2vni-110
        name: evpn
      volumes:
      - containerDisk:
          image: quay.io/kubevirt/fedora-with-test-tooling-container-disk:v1.7.0
        name: os
      - cloudInitNoCloud:
          networkData: |
            ethernets:
              id0:
                match:
                  macaddress: '02:79:38:33:33:33'
                addresses:
                  - 192.170.1.3/24
                gateway4: 192.170.1.1
                routes:
                  - to: 192.169.1.0/24
                    via: 192.170.1.1
            version: 2
        name: cloudinitdisk
