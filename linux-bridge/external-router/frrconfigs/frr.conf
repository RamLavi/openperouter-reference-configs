service integrated-vtysh-config

log stdout debug
log timestamp precision 3

debug zebra events
debug zebra vxlan
debug bgp zebra
debug zebra events
debug zebra vxlan
debug bgp zebra
debug zebra events
debug zebra nht
debug zebra kernel
debug zebra rib
debug zebra nexthop
debug bgp neighbor-events
debug bgp updates
debug bgp keepalives
debug bgp nht
debug bgp zebra
debug bfd network
debug bfd peer
debug bfd zebra


vrf red
 vni 100
exit-vrf

router bgp 64512 vrf red
 !
 address-family ipv4 unicast
  redistribute connected
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
  advertise ipv6 unicast
 exit-address-family
exit

router bgp 64512
 no bgp ebgp-requires-policy
 no bgp network import-check
 no bgp default ipv4-unicast

 neighbor 192.168.10.31 peer-group
 neighbor 192.168.10.31 remote-as 64514
 neighbor 192.168.10.245 peer-group
 neighbor 192.168.10.245 remote-as 64514

 bgp listen range 192.168.10.0/24 peer-group 192.168.10.31
 bgp listen range 192.168.10.0/24 peer-group 192.168.10.245

 !
 address-family ipv4 unicast
  network 100.64.0.1/32
  neighbor 192.168.10.31 activate
  neighbor 192.168.10.245 activate
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor 192.168.10.31 activate
  neighbor 192.168.10.31 allowas-in origin
  neighbor 192.168.10.245 activate
  neighbor 192.168.10.245 allowas-in origin
  advertise-all-vni
  advertise-svi-ip
 exit-address-family
exit
!
