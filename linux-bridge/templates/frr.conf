service integrated-vtysh-config

log stdout debug
log timestamp precision 3

debug zebra events
debug zebra vxlan
debug bgp zebra
debug zebra events
debug zebra vxlan
debug bgp zebra
debug zebra events
debug zebra nht
debug zebra kernel
debug zebra rib
debug zebra nexthop
debug bgp neighbor-events
debug bgp updates
debug bgp keepalives
debug bgp nht
debug bgp zebra
debug bfd network
debug bfd peer
debug bfd zebra

vrf $VRF
 vni $L3VNI
exit-vrf

router bgp $ASN vrf $VRF
 !
 address-family ipv4 unicast
  redistribute connected
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
  advertise ipv6 unicast
 exit-address-family
exit

router bgp $ASN
 no bgp ebgp-requires-policy
 no bgp network import-check
 no bgp default ipv4-unicast

 neighbor ocp-nodes peer-group
 neighbor ocp-nodes remote-as $NEI_ASN

 bgp listen range $NEI_CIDR peer-group ocp-nodes

 !
 address-family ipv4 unicast
  network $VTEP_CIDR
  neighbor ocp-nodes activate
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor ocp-nodes activate
  neighbor ocp-nodes allowas-in origin
  advertise-all-vni
  advertise-svi-ip
 exit-address-family
exit
!


