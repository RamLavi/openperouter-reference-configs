apiVersion: nmstate.io/v1
kind: NodeNetworkConfigurationPolicy
metadata:
  name: $META_NAME
spec:
  nodeSelector:
    node-role.kubernetes.io/worker: ''
  desiredState:
    interfaces:
      - bridge:
          options:
            stp:
              enabled: false
        ipv4:
          dhcp: false
          enabled: false
        name: $L2VNI_BRIDGE
        state: up
        type: linux-bridge
