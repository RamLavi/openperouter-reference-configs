---
apiVersion: openpe.openperouter.github.io/v1alpha1
kind: L3VNI
metadata:
  name: red
  namespace: openperouter-system
spec:
  vni: 100
  vrf: red
---
apiVersion: openpe.openperouter.github.io/v1alpha1
kind: L2VNI
metadata:
  name: layer2
  namespace: openperouter-system
spec:
  hostmaster:
    ovsBridge:
      name: ovsbr1
    type: ovs-bridge
  l2gatewayips:
    - 192.170.1.1/24
  vni: 110
  vrf: red
---
apiVersion: openpe.openperouter.github.io/v1alpha1
kind: Underlay
metadata:
  name: underlay-multi-homing-worker-0
  namespace: openperouter-system
spec:
  asn: 64514
  nodeSelector:
    matchLabels:
      kubernetes.io/hostname: multi-homing-worker-0
  tunnelEndpoint:
    cidrs:
    - 100.65.0.0/24
  interfaces:
    - type: CNIDevice
      cniDevice:
        type: RawConfig
        interfaceName: net1
        rawConfig:
          cniVersion: "1.0.0"
          name: macvlan-underlay
          plugins:
            - type: macvlan
              master: bond1
              mode: bridge
              ipam:
                type: static
                addresses:
                  - address: 10.200.11.50/16
  neighbors:
    - asn: 64512
      address: 10.200.11.8
---
apiVersion: openpe.openperouter.github.io/v1alpha1
kind: Underlay
metadata:
  name: underlay-multi-homing-worker-1
  namespace: openperouter-system
spec:
  asn: 64514
  nodeSelector:
    matchLabels:
      kubernetes.io/hostname: multi-homing-worker-1
  tunnelEndpoint:
    cidrs:
    - 100.65.0.0/24
  interfaces:
    - type: CNIDevice
      cniDevice:
        type: RawConfig
        interfaceName: net1
        rawConfig:
          cniVersion: "1.0.0"
          name: macvlan-underlay
          plugins:
            - type: macvlan
              master: bond1
              mode: bridge
              ipam:
                type: static
                addresses:
                  - address: 10.200.11.51/16
  neighbors:
    - asn: 64512
      address: 10.200.11.8

